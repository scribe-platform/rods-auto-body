site: rods-auto-body
siteName: Rod's Auto Body
turnstileSiteKey: 0x4AAAAAAFHtLCWg1S7IznJp
contactCollection: inquiries

collections:
  - name: services
    label: Services
    path: content/services
    format: yaml-frontmatter
    description: The four service cards on the homepage and the detailed write-ups on the Services page.
    view:
      primary: title
      sort: order
      fields: [title, order]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: cardTitle
        label: Homepage card title (defaults to Title)
        type: string
      - name: shortDescription
        label: Short description (homepage card)
        type: text
        required: true
      - name: icon
        label: Icon
        type: select
        required: true
        options:
          - value: collision
            label: Collision (wrench)
          - value: dent
            label: Paintless dent (target)
          - value: glass
            label: Glass & windshield
          - value: rental
            label: Car & van rental
      - name: order
        label: Display order
        type: number
        default: 0
      - name: body
        label: Full description (Services page)
        type: rich-text
        isBody: true

  - name: gallery
    label: Gallery
    path: content/gallery
    format: yaml
    description: Photos of vehicles that have come through the shop, shown on the Gallery page.
    view:
      primary: caption
      sort: order
      fields: [caption, order]
    fields:
      - name: image
        label: Photo
        type: image
        required: true
      - name: caption
        label: Caption / alt text
        type: string
      - name: order
        label: Display order
        type: number
        default: 0

  - name: fleet
    label: Rental Fleet
    path: content/fleet
    format: yaml
    description: The rental vehicles listed on the Services page.
    view:
      primary: title
      sort: order
      fields: [title, order]
    fields:
      - name: title
        label: Vehicle
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: order
        label: Display order
        type: number
        default: 0

  - name: reviews
    label: Reviews
    path: content/reviews
    format: yaml
    description: Customer reviews shown on the homepage.
    view:
      primary: author
      sort: order
      fields: [author, rating, order]
    fields:
      - name: quote
        label: Review text
        type: text
        required: true
      - name: author
        label: Reviewer name
        type: string
        required: true
      - name: source
        label: Source
        type: string
        default: Google review
      - name: rating
        label: Star rating
        type: number
        default: 5
      - name: order
        label: Display order
        type: number
        default: 0

  - name: inquiries
    label: Customer Inquiries
    path: content/inquiries
    format: yaml
    form: true
    description: Messages sent through the contact form.
    workflow:
      field: status
      states: [new, contacted, closed]
    notify: []
    view:
      fields: [name, contact, status, createdAt]
      sort: createdAt
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: contact
        label: Phone or Email
        type: string
        required: true
      - name: message
        label: Message
        type: text
        required: true
      - name: status
        label: Status
        type: select
        default: new
        options:
          - value: new
            label: New
          - value: contacted
            label: Contacted
          - value: closed
            label: Closed
      - name: createdAt
        label: Submitted At
        type: string
